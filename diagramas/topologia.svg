<title id="title">Arquitectura implementada: AAA RADIUS con Cisco y Windows NPS</title>
<desc id="description">R1 y SW1 conectados a CLOUD-AAA en GNS3 VM100, conectado por vmbr50 al servidor Windows NPS VM150. Red 10.25.13.0/24, puertos SSH 22 y RADIUS UDP 1812 y 1813.</desc>
